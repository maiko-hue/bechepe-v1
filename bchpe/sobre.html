<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDHDXn-R6jgd4fBkgW4KzFp6p6Ym_yqQoI",
        authDomain: "yapedata.firebaseapp.com",
        projectId: "yapedata",
        storageBucket: "yapedata.firebasestorage.app",
        messagingSenderId: "228862586517",
        appId: "1:228862586517:web:4e2b2578fe0f826e32b59c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const elEmail = document.getElementById('info-email'); elEmail.innerHTML = user.email;
            
            try {
                const userRef = doc(db, "clientes_bcp", user.email);
                const snap = await getDoc(userRef);
                if (snap.exists()) {
                    const datos = snap.data();
                    const fbDate = datos.fecha || new Date().toISOString();
                    
                    const dateObj = new Date(fbDate);
                    const formattedDate = dateObj.toLocaleDateString('es-PE', { day: '2-digit', month: '2-digit', year: 'numeric' });
                    document.getElementById('info-act-date').innerHTML = formattedDate;
                    
                    // Backup for future
                    localStorage.setItem('userEmail', user.email);
                    localStorage.setItem('userActDate', fbDate);
                } else {
                    document.getElementById('info-act-date').innerHTML = 'No encontrado';
                }
            } catch (err) {
                console.error("Error fetching user data:", err);
                document.getElementById('info-act-date').innerHTML = 'Error red';
            }
        } else {
            document.getElementById('info-email').innerHTML = 'No logueado';
            document.getElementById('info-act-date').innerHTML = '--/--/----';
        }
    });
</script>

    <script>
        if ('serviceWorker' in navigator) {
