<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Información - BCP</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            /* Elimina el recuadro azul al hacer clic en celulares */
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
            
            /* Bloquea la selección de texto en toda la app */
            -webkit-user-select: none !important; 
            -moz-user-select: none !important; 
            -ms-user-select: none !important; 
            user-select: none !important; 
            box-sizing: border-box;
        }

        /* Excepción para que sí se pueda seleccionar/escribir en los inputs */
        input, textarea, select {
            -webkit-user-select: auto !important;
            -moz-user-select: auto !important;
            -ms-user-select: auto !important;
            user-select: auto !important;
        }

        /* Bloquea el menú de descarga al mantener presionadas las imágenes */
        img {
            -webkit-touch-callout: none !important;
            -webkit-user-drag: none !important;
        }

        body {
            background-color: #f2f4f7;
            margin: 0;
            font-family: 'Roboto', sans-serif;
            /* Evita que la página se recargue al deslizar hacia abajo (Pull-to-refresh) */
            overscroll-behavior-y: none;
            overflow-x: hidden;
            height: 100vh;
        }

        /* --- FONDO SUPERIOR AZUL BCP --- */
        .blue-bg-curve {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 250px;
            background-color: #002A8D;
            border-bottom-left-radius: 35px;
            border-bottom-right-radius: 35px;
            z-index: 1;
        }

        /* --- CABECERA --- */
        .header {
            display: flex;
            align-items: center;
            padding: 20px;
            position: relative;
            z-index: 2;
            height: 120px;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            cursor: pointer;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            position: absolute;
            left: 20px;
            top: 30px;
        }
        .logo-center {
            height: 100px;
            object-fit: contain;
            position: absolute;
            left: 50%;
            top: 15px;
            transform: translateX(-50%);
        }

        /* --- TARJETA BLANCA PRINCIPAL --- */
        .main-card {
            position: relative;
            z-index: 3;
            background: white;
            margin: 10px 20px 40px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 35px 20px 30px 20px;
            text-align: center;
        }

        /* --- ICONO CIRCULAR --- */
        .info-logo {
            width: 65px;
            height: 65px;
            background-color: #002A8D;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 12px rgba(0, 42, 141, 0.2);
        }

        .card-title {
            font-size: 24px;
            font-weight: 700;
            color: #002A8D;
            margin: 0 0 5px 0;
            letter-spacing: 0.5px;
        }
        .card-subtitle {
            font-size: 14px;
            color: #888;
            margin: 0 0 30px 0;
            font-weight: 500;
        }

        /* --- LISTA DE DETALLES --- */
        .details-list {
            text-align: left;
            margin-bottom: 35px;
            background: #f9f9fb;
            border-radius: 12px;
            border: 1px solid #eaeaea;
            padding: 16px;
        }
        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
        }
        .detail-item:last-child {
            border-bottom: none;
        }
        .detail-label {
            color: #666;
            font-weight: 500;
        }
        .detail-value {
            color: #002A8D;
            font-weight: 700;
            text-align: right;
        }

        /* --- BOTONES DE ACCIÓN --- */
        .btn-bcp {
            background-color: #FF7800; /* Naranja BCP */
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            margin-bottom: 15px;
            transition: transform 0.1s;
            letter-spacing: 0.5px;
        }
        .btn-bcp:active {
            transform: scale(0.97);
        }
        .btn-blue {
            background-color: #002A8D; /* Azul BCP */
        }
    </style>
</head>
<body>

    <!-- FONDO Y CABECERA -->
    <div class="blue-bg-curve"></div>
    
    <header class="header">
        <a href="opciones.html" class="back-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <img src="img/secondlogo.png" alt="Logo" class="logo-center">
    </header>

    <main class="main-card">
        
        <div class="info-logo">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                <line x1="12" y1="18" x2="12.01" y2="18"></line>
            </svg>
        </div>
        
        <h1 class="card-title">BECHEPE V2.0</h1>
        <p class="card-subtitle">AppsReborn-BCEPE</p>

        <div class="details-list">
            <div class="detail-item">
                <span class="detail-label">Versión</span>
                <span class="detail-value">2.0 (Premium Access)</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Última Actualización</span>
                <span class="detail-value">27/07/2026</span>
            </div>
        </div>

        <a href="https://t.me/MaikolEsleiter" class="btn-bcp" target="_blank">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="16 18 22 12 16 6"></polyline>
                <polyline points="8 6 2 12 8 18"></polyline>
            </svg> 
            DESARROLLADOR
        </a>
        
        <a href="https://t.me/appsreborn" class="btn-bcp btn-blue" target="_blank">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg> 
            GRUPO OFICIAL
        </a>

    </main>

</body>
</html>
