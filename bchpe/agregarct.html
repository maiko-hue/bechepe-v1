<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agregar Contacto - BCP</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            /* Elimina el recuadro azul al hacer clic en celulares */
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
            
            /* Bloquea la selección de texto en toda la app */
            -webkit-user-select: none !important; 
            -moz-user-select: none !important; 
            -ms-user-select: none !important; 
            user-select: none !important; 
            box-sizing: border-box;
        }

        /* Excepción para que sí se pueda seleccionar/escribir en los inputs */
        input, textarea, select {
            -webkit-user-select: auto !important;
            -moz-user-select: auto !important;
            -ms-user-select: auto !important;
            user-select: auto !important;
        }

        /* Bloquea el menú de descarga al mantener presionadas las imágenes */
        img {
            -webkit-touch-callout: none !important;
            -webkit-user-drag: none !important;
        }

        body {
            background-color: #f2f4f7;
            margin: 0;
            font-family: 'Roboto', sans-serif;
            /* Evita que la página se recargue al deslizar hacia abajo (Pull-to-refresh) */
            overscroll-behavior-y: none;
            overflow-x: hidden;
            height: 100vh;
        }

        /* --- FONDO SUPERIOR AZUL BCP --- */
        .blue-bg-curve {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 250px;
            background-color: #002A8D;
            border-bottom-left-radius: 35px;
            border-bottom-right-radius: 35px;
            z-index: 1;
        }

        /* --- CABECERA --- */
        .header {
            display: flex;
            align-items: center;
            padding: 20px;
            position: relative;
            z-index: 2;
            height: 120px;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            cursor: pointer;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            position: absolute;
            left: 20px;
            top: 30px;
        }
        .logo-center {
            height: 100px;
            object-fit: contain;
            position: absolute;
            left: 50%;
            top: 15px;
            transform: translateX(-50%);
        }

        /* --- TARJETA BLANCA PRINCIPAL --- */
        .main-card {
            position: relative;
            z-index: 3;
            background: white;
            margin: 10px 20px 40px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 30px 20px;
        }
        
        .card-title {
            font-size: 22px;
            font-weight: 700;
            color: #002A8D;
            text-align: center;
            margin: 0 0 5px 0;
        }
        .card-subtitle {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin: 0 0 30px 0;
        }

        /* --- FORMULARIO Y ESTILOS DE CASILLAS --- */
        .form-group {
            margin-bottom: 25px;
        }
        .input-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #888;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .input-wrapper {
            display: flex;
            align-items: center;
            background-color: #f9f9fb;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            padding: 14px 15px;
            transition: border-color 0.3s;
        }
        .input-wrapper:focus-within {
            border-color: #FF7800; /* Naranja BCP en el focus */
            background-color: #ffffff;
        }
        .input-icon {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            flex-shrink: 0;
            color: #002A8D;
        }
        .custom-input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            outline: none;
            font-family: 'Roboto', sans-serif;
        }
        .custom-input::placeholder {
            color: #aaa;
            font-weight: 400;
        }
        
        /* Estilos específicos para el Select */
        select.custom-input {
            -webkit-appearance: none; 
            appearance: none; 
            cursor: pointer;
        }
        select.custom-input option {
            background-color: white; 
            color: #333;
        }

        /* --- BOTÓN GUARDAR --- */
        .btn-save {
            width: 100%;
            background-color: #002A8D;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 16px;
            font-size: 15px;
            font-weight: 600;
            margin-top: 5px;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: transform 0.1s, background-color 0.3s;
        }
        .btn-save:active {
            transform: scale(0.97);
        }

        /* --- ESTILOS DE LA ANIMACIÓN (PACMAN) --- */
        .custom-loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 9999;
            display: none; justify-content: center; align-items: center;
            flex-direction: column; backdrop-filter: blur(4px);
        }
        .loader { width: 8em; height: 8em; }
        .loader__eye1, .loader__eye2, .loader__mouth1, .loader__mouth2 { animation: eye1 3s ease-in-out infinite; }
        .loader__eye1, .loader__eye2 { transform-origin: 64px 64px; }
        .loader__eye2 { animation-name: eye2; }
        .loader__mouth1 { animation-name: mouth1; }
        .loader__mouth2 { animation-name: mouth2; visibility: hidden; }
        @keyframes eye1 {
            from { transform: rotate(-260deg) translate(0, -56px); }
            50%, 60% { animation-timing-function: cubic-bezier(0.17, 0, 0.58, 1); transform: rotate(-40deg) translate(0, -56px) scale(1); }
            to { transform: rotate(225deg) translate(0, -56px) scale(0.35); }
        }
        @keyframes eye2 {
            from { transform: rotate(-260deg) translate(0, -56px); }
            50% { transform: rotate(40deg) translate(0, -56px) rotate(-40deg) scale(1); }
            52.5% { transform: rotate(40deg) translate(0, -56px) rotate(-40deg) scale(1, 0); }
            55%, 70% { animation-timing-function: cubic-bezier(0, 0, 0.28, 1); transform: rotate(40deg) translate(0, -56px) rotate(-40deg) scale(1); }
            to { transform: rotate(150deg) translate(0, -56px) scale(0.4); }
        }
        @keyframes mouth1 {
            from { animation-timing-function: ease-in; stroke-dasharray: 0 351.86; stroke-dashoffset: 0; }
            25% { animation-timing-function: ease-out; stroke-dasharray: 175.93 351.86; stroke-dashoffset: 0; }
            50% { animation-timing-function: steps(1, start); stroke-dasharray: 175.93 351.86; stroke-dashoffset: -175.93; visibility: visible; }
            75%, to { visibility: hidden; }
        }
        @keyframes mouth2 {
            from { animation-timing-function: steps(1, end); visibility: hidden; }
            50% { animation-timing-function: ease-in-out; visibility: visible; stroke-dashoffset: 0; }
            to { stroke-dashoffset: -351.86; }
        }

        /* --- NOTIFICACIÓN PERSONALIZADA (TOAST) --- */
        .toast {
            visibility: hidden; min-width: 250px; margin-left: -125px;
            background-color: #333; color: #fff; text-align: center;
            border-radius: 50px; padding: 16px; position: fixed;
            z-index: 10000; left: 50%; bottom: 30px; font-size: 14px; font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }
        .toast.show { visibility: visible; opacity: 1; bottom: 50px; }
        .toast.success { background-color: #2BD071; color: white; }
        .toast.error { background-color: #d32f2f; color: white; }
    </style>
</head>
<body>

    <!-- Animación Pacman de Carga -->
    <div class="custom-loader-overlay" id="pacmanLoader">
        <svg height="108px" width="108px" viewBox="0 0 128 128" class="loader">
            <defs>
              <clipPath id="loader-eyes">
                <circle transform="rotate(-40,64,64) translate(0,-56)" r="8" cy="64" cx="64" class="loader__eye1"></circle>
                <circle transform="rotate(40,64,64) translate(0,-56)" r="8" cy="64" cx="64" class="loader__eye2"></circle>
              </clipPath>
              <linearGradient y2="1" x2="0" y1="0" x1="0" id="loader-grad">
                <stop stop-color="#000" offset="0%"></stop>
                <stop stop-color="#fff" offset="100%"></stop>
              </linearGradient>
              <mask id="loader-mask">
                <rect fill="url(#loader-grad)" height="128" width="128" y="0" x="0"></rect>
              </mask>
            </defs>
            <g stroke-dasharray="175.93 351.86" stroke-width="12" stroke-linecap="round">
              <g>
                <rect clip-path="url(#loader-eyes)" height="64" width="128" fill="hsl(193,90%,50%)"></rect>
                <g stroke="hsl(193,90%,50%)" fill="none">
                  <circle transform="rotate(180,64,64)" r="56" cy="64" cx="64" class="loader__mouth1"></circle>
                  <circle transform="rotate(0,64,64)" r="56" cy="64" cx="64" class="loader__mouth2"></circle>
                </g>
              </g>
              <g mask="url(#loader-mask)">
                <rect clip-path="url(#loader-eyes)" height="64" width="128" fill="hsl(223,90%,50%)"></rect>
                <g stroke="hsl(223,90%,50%)" fill="none">
                  <circle transform="rotate(180,64,64)" r="56" cy="64" cx="64" class="loader__mouth1"></circle>
                  <circle transform="rotate(0,64,64)" r="56" cy="64" cx="64" class="loader__mouth2"></circle>
                </g>
              </g>
            </g>
        </svg>
        <p style="margin-top:20px; font-weight:600; color:white;">Guardando en la Nube...</p>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Mensaje aquí</div>

    <!-- FONDO Y CABECERA -->
    <div class="blue-bg-curve"></div>
    
    <header class="header">
        <a href="opciones.html" class="back-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <img src="img/secondlogo.png" alt="Logo" class="logo-center">
    </header>

    <main class="main-card">
        <h1 class="card-title">Nuevo Contacto</h1>
        <p class="card-subtitle">Registra los datos para autocompletado</p>

        <div class="form-group">
            <span class="input-label">NÚMERO DE CELULAR</span>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                    <line x1="12" y1="18" x2="12.01" y2="18"></line>
                </svg>
                <input type="tel" id="contactNumber" class="custom-input" placeholder="999 999 999" maxlength="9" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');" autocomplete="off">
            </div>
        </div>

        <div class="form-group">
            <span class="input-label">NOMBRE Y APELLIDO</span>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <input type="text" id="contactName" class="custom-input" placeholder="Ej. Juan Pérez" autocomplete="off">
            </div>
        </div>

        <div class="form-group">
            <span class="input-label">DESTINO</span>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="10" rx="2" ry="2"></rect>
                    <circle cx="12" cy="5" r="2"></circle>
                    <path d="M12 7v4"></path>
                    <line x1="8" y1="16" x2="8.01" y2="16"></line>
                    <line x1="16" y1="16" x2="16.01" y2="16"></line>
                </svg>
                <select id="contactDestino" class="custom-input">
                    <option value="Yape">Yape</option>
                    <option value="Plin">Plin</option>
                    <option value="Bim">Bim</option>
                    <option value="Tunki">Tunki</option>
                    <option value="Agora / Oh!">Agora / Oh!</option>
                    <option value="BCP">BCP</option>
                    <option value="BBVA">BBVA</option>
                    <option value="Interbank">Interbank</option>
                    <option value="Financiera Efectiva">Financiera Efectiva</option>
                    <option value="Dale">Dale</option>
                    <option value="IziPay">IziPay</option>
                </select>
            </div>
        </div>

        <button class="btn-save" id="btnGuardar">GUARDAR CONTACTO</button>

    </main>

    <script type="module">
        // IMPORTAMOS TU CONEXIÓN A FIREBASE DE FORMA DIRECTA
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHDXn-R6jgd4fBkgW4KzFp6p6Ym_yqQoI",
            authDomain: "yapedata.firebaseapp.com",
            projectId: "yapedata",
            storageBucket: "yapedata.firebasestorage.app",
            messagingSenderId: "228862586517",
            appId: "1:228862586517:web:4e2b2578fe0f826e32b59c"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Función para mostrar el mensaje personalizado
        window.showToast = function(message, type) {
            var x = document.getElementById("toast");
            x.textContent = message;
            x.className = "toast show " + type; 
            setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
        }

        document.getElementById('btnGuardar').addEventListener('click', async () => {
            const numero = document.getElementById('contactNumber').value;
            const nombre = document.getElementById('contactName').value;
            const destino = document.getElementById('contactDestino').value;
            const loader = document.getElementById('pacmanLoader');

            // VALIDACIÓN ESTRICTA
            if(numero.length !== 9 || nombre.trim() === "") {
                showToast("Datos Erróneos", "error"); 
                return;
            }

            // SI TODO ESTÁ BIEN, MOSTRAMOS PACMAN
            loader.style.display = 'flex';

            try {
                // Guardamos en la colección "usuarios_yape". 
                // El ID del documento será el número de teléfono.
                await setDoc(doc(db, "usuarios_yape", numero), {
                    nombre: nombre,
                    destino: destino
                });

                // Esperamos un poquito para que se aprecie la animación
                setTimeout(() => {
                    loader.style.display = 'none';
                    
                    showToast("¡Guardado en la Nube!", "success");

                    // Redirigir
                    setTimeout(() => {
                        window.location.href = 'opciones.html';
                    }, 1500);

                }, 2000);

            } catch (error) {
                console.error("Error al guardar:", error);
                loader.style.display = 'none';
                showToast("Error de conexión", "error");
            }
        });
    </script>
</body>
</html>
