<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voucher Editable - BCP</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            /* Elimina el recuadro azul al hacer clic en celulares */
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
            
            /* Bloquea la selección de texto en toda la app */
            -webkit-user-select: none !important; 
            -moz-user-select: none !important; 
            -ms-user-select: none !important; 
            user-select: none !important; 
            box-sizing: border-box;
        }

        /* Excepción para que sí se pueda seleccionar/escribir en los inputs */
        input, textarea, select {
            -webkit-user-select: auto !important;
            -moz-user-select: auto !important;
            -ms-user-select: auto !important;
            user-select: auto !important;
        }

        /* Bloquea el menú de descarga al mantener presionadas las imágenes */
        img {
            -webkit-touch-callout: none !important;
            -webkit-user-drag: none !important;
        }

        body {
            background-color: #f2f4f7;
            margin: 0;
            font-family: 'Roboto', sans-serif;
            /* Evita que la página se recargue al deslizar hacia abajo (Pull-to-refresh) */
            overscroll-behavior-y: none;
            overflow-x: hidden;
            height: 100vh;
        }

        /* --- FONDO SUPERIOR AZUL BCP --- */
        .blue-bg-curve {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 250px;
            background-color: #002A8D;
            border-bottom-left-radius: 35px;
            border-bottom-right-radius: 35px;
            z-index: 1;
        }

        /* --- CABECERA --- */
        .header {
            display: flex;
            align-items: center;
            padding: 20px;
            position: relative;
            z-index: 2;
            height: 120px;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            cursor: pointer;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            position: absolute;
            left: 20px;
            top: 30px;
        }
        .logo-center {
            height: 100px;
            object-fit: contain;
            position: absolute;
            left: 50%;
            top: 15px;
            transform: translateX(-50%);
        }

        /* --- TARJETA BLANCA PRINCIPAL --- */
        .main-card {
            position: relative;
            z-index: 3;
            background: white;
            margin: 10px 20px 40px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 30px 20px;
        }
        
        .card-title {
            font-size: 22px;
            font-weight: 700;
            color: #002A8D;
            text-align: center;
            margin: 0 0 5px 0;
        }
        .card-subtitle {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin: 0 0 30px 0;
        }

        /* --- FORMULARIO Y ESTILOS DE CASILLAS --- */
        .form-group {
            margin-bottom: 22px;
        }
        .input-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #888;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .input-wrapper {
            display: flex;
            align-items: center;
            background-color: #f9f9fb;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            padding: 14px 15px;
            transition: border-color 0.3s;
        }
        .input-wrapper:focus-within {
            border-color: #FF7800; /* Naranja BCP en el focus */
            background-color: #ffffff;
        }
        .input-icon {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            flex-shrink: 0;
            color: #002A8D;
        }
        .custom-input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            outline: none;
            font-family: 'Roboto', sans-serif;
        }
        .custom-input::placeholder {
            color: #aaa;
            font-weight: 400;
            font-size: 15px;
        }
        
        /* --- BOTÓN GUARDAR --- */
        .btn-save {
            width: 100%;
            background-color: #002A8D;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 16px;
            font-size: 15px;
            font-weight: 600;
            margin-top: 10px;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: transform 0.1s, background-color 0.3s;
        }
        .btn-save:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <!-- FONDO Y CABECERA -->
    <div class="blue-bg-curve"></div>
    
    <header class="header">
        <a href="opciones.html" class="back-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <img src="img/secondlogo.png" alt="Logo" class="logo-center">
    </header>

    <main class="main-card">
        <h1 class="card-title">Voucher Editable</h1>
        <p class="card-subtitle">Personaliza los datos del comprobante</p>

        <div class="form-group">
            <span class="input-label">NOMBRE DEL DESTINATARIO</span>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <input type="text" id="nombre" class="custom-input" placeholder="Ej: Maikol Esleiter" autocomplete="off">
            </div>
        </div>

        <div class="form-group">
            <span class="input-label">NÚMERO DE CUENTA (ÚLTIMOS 4)</span>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="5" width="20" height="14" rx="2" ry="2"></rect>
                    <line x1="2" y1="10" x2="22" y2="10"></line>
                </svg>
                <input type="text" id="cuenta" class="custom-input" inputmode="numeric" maxlength="4" minlength="4" placeholder="**** 3131" oninput="this.value = this.value.replace(/[^0-9]/g, '');" autocomplete="off">
            </div>
        </div>

        <div class="form-group">
            <span class="input-label">MONTO</span>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"></path>
                    <line x1="12" y1="18" x2="12" y2="6"></line>
                </svg>
                <span style="color: #666; font-weight: 500; font-size: 16px; margin-right: 5px;">S/</span>
                <input type="text" id="monto" class="custom-input" inputmode="decimal" maxlength="10" placeholder="0.00" oninput="this.value = this.value.replace(/[^0-9.]/g, '');" autocomplete="off">
            </div>
        </div>

        <div class="form-group">
            <span class="input-label">FECHA Y HORA</span>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <input type="text" id="fecha" class="custom-input" placeholder="Martes, 31 Diciembre 2025 - 01:01 p.m." autocomplete="off">
            </div>
        </div>

        <button class="btn-save" onclick="guardarYRedirigir()">SIGUIENTE</button>

    </main>

    <script>
        function guardarYRedirigir() {
            const nombre = document.getElementById('nombre').value || "Maikol Esleiter";
            const cuenta = document.getElementById('cuenta').value || "3131"; 
            let monto = document.getElementById('monto').value || "12.00";
            const fecha = document.getElementById('fecha').value || document.getElementById('fecha').placeholder;

            localStorage.setItem('v_nombre', nombre);
            localStorage.setItem('v_cuenta', cuenta);
            localStorage.setItem('v_monto', monto);
            localStorage.setItem('v_fecha', fecha);

            window.location.href = 'exito_editable.html';
        }
    </script>
</body>
</html>
