<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voucher Editable - BCP</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
        <link rel="stylesheet" href="css/editable.css">

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#002A8D">
    <link rel="apple-touch-icon" href="img/app-icon.png">
</head>
<body>

    <!-- FONDO Y CABECERA -->
    <div class="blue-bg-curve"></div>
    
    <header class="header">
        <a href="opciones.html" class="back-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <img src="img/secondlogo.png" alt="Logo" class="logo-center">
    </header>

    <main class="main-card">
        <h1 class="card-title">Voucher Editable</h1>
        <p class="card-subtitle">Personaliza los datos del comprobante</p>

        <div class="form-group">
            <span class="input-label">NOMBRE DEL DESTINATARIO</span>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <input type="text" id="nombre" class="custom-input" placeholder="Ej: Maikol Esleiter" autocomplete="off">
            </div>
        </div>

        <div class="form-group">
            <span class="input-label">NÚMERO DE CUENTA (ÚLTIMOS 4)</span>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="5" width="20" height="14" rx="2" ry="2"></rect>
                    <line x1="2" y1="10" x2="22" y2="10"></line>
                </svg>
                <input type="text" id="cuenta" class="custom-input" inputmode="numeric" maxlength="4" minlength="4" placeholder="**** 3131" oninput="this.value = this.value.replace(/[^0-9]/g, '');" autocomplete="off">
            </div>
        </div>

        <div class="form-group">
            <span class="input-label">MONTO</span>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"></path>
                    <line x1="12" y1="18" x2="12" y2="6"></line>
                </svg>
                <span style="color: #666; font-weight: 500; font-size: 16px; margin-right: 5px;">S/</span>
                <input type="text" id="monto" class="custom-input" inputmode="decimal" maxlength="10" placeholder="0.00" oninput="this.value = this.value.replace(/[^0-9.]/g, '');" autocomplete="off">
            </div>
        </div>

        <div class="form-group">
            <span class="input-label">FECHA Y HORA</span>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <input type="text" id="fecha" class="custom-input" placeholder="Martes 31 diciembre 2025 - 01:01 pm." autocomplete="off">
            </div>
        </div>

        <button class="btn-save" onclick="guardarYRedirigir()">SIGUIENTE</button>

    </main>

    <script>
        function guardarYRedirigir() {
            const nombre = document.getElementById('nombre').value || "Maikol Esleiter";
            const cuenta = document.getElementById('cuenta').value || "3131"; 
            let monto = document.getElementById('monto').value || "12.00";
            const fecha = document.getElementById('fecha').value || document.getElementById('fecha').placeholder;

            localStorage.setItem('v_nombre', nombre);
            localStorage.setItem('v_cuenta', cuenta);
            localStorage.setItem('v_monto', monto);
            localStorage.setItem('v_fecha', fecha);

            window.location.href = 'exito_editable.html';
        }
    </script>
<script src="zoom.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('Error SW', err));
            });
        }
    </script>
</body>
</html>
