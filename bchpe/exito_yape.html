<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Operación exitosa</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

        <link rel="stylesheet" href="css/exito_yape.css">

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#002A8D">
    <link rel="apple-touch-icon" href="img/app-icon.png">
</head>
<body>

    <div class="container" id="captureArea">
        <div class="check-icon">
            <svg viewBox="0 0 50 50">
                <circle class="circle-path" cx="25" cy="25" r="23" stroke="#ff7e00" stroke-width="2" fill="none"/>
                <path class="check-path" d="M15 25 L22 32 L35 18" stroke="#ff7e00" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <h2>¡Operación exitosa!</h2>
        <div class="monto-grande" id="displayMonto">S/ 0.00</div>
        <div class="fecha-sub" id="displayFecha">--</div>

        <div class="acciones" id="divAcciones">
            <div class="accion-btn" onclick="descargarVoucher()"><img src="img/descargar-icon.svg" alt="Descargar"> Descargar</div>
            <div class="accion-btn" onclick="compartirVoucher()"><img src="img/compartir-icon.svg" alt="Compartir"> Compartir</div>
        </div>

        <div class="detalles-lista">
            <div class="fila">
                <div class="label">Enviado a</div>
                <div class="valor">
                    <strong id="displayNombre">Nombre Contacto</strong>
                    <span id="displayNumero" style="letter-spacing: 1px;">*** **4 214</span>
                    <span id="displayEntidad">Yape</span> 
                </div>
            </div>
            
            <div class="fila">
                <div class="label">Comisión</div>
                <div class="valor">
                    <strong>Gratis</strong>
                </div>
            </div>

            <div class="fila">
                <div class="label">Desde</div>
                <div class="valor">
                    <strong>Cuenta Digital Soles</strong>
                    <span>7809</span>
                </div>
            </div>
            <div class="fila" style="border-bottom: none;"> 
                <div class="label">Número de operación</div>
                <div class="valor">
                    <strong id="numOperacion">0000000</strong>
                </div>
            </div>
        </div>

        <div class="separador-banner" id="divSeparador"></div>

        <div class="banner" id="divBanner">
            <img src="img/super-des.svg" alt="Personaje" class="banner-img">
            <div class="banner-text">
                <h4>Protege tus tarjetas</h4>
                <p>Por solo S/ 13.99 al mes inc. IGV</p>
            </div>
        </div>

        <button class="btn-otra" id="btnOtra" onclick="window.location.href='yapearcel.html'">Yapear a otro celular</button>
        <a href="inicio.html" class="link-inicio" id="linkInicio">Ir al inicio</a>
    </div>

    <script>
        // 1. RECUPERAR DATOS
        const nombre = localStorage.getItem('v_nombre_yape') || "Nombre";
        const celular = localStorage.getItem('v_celular_destino') || "000000000";
        let monto = localStorage.getItem('v_monto_yape');
        const entidad = localStorage.getItem('v_entidad_destino') || "Yape"; 

        // 2. FORMATEAR MONTO
        if(monto) {
            if (!isNaN(monto)) { monto = parseFloat(monto).toFixed(2); }
        } else { monto = "0.00"; }

        // 3. FORMATEAR NÚMERO (*** **4 214)
        let numeroFinal = "*** **0 000";
        let ultimosCuatro = "0000"; 
        if (celular.length === 9) {
            const last4 = celular.slice(-4);
            ultimosCuatro = last4;
            const part1 = last4.charAt(0);
            const part2 = last4.slice(1);
            numeroFinal = `*** **${part1} ${part2}`;
        }

        // 4. GENERAR NÚMERO DE OPERACIÓN Y FECHA DINÁMICA
        const randomOp = Math.floor(10000000 + Math.random() * 90000000);
        
        const meses = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
        const dias = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
        const ahora = new Date();
        let ampm = ahora.getHours() >= 12 ? 'p.m.' : 'a.m.';
        let hora = ahora.getHours() % 12;
        hora = hora ? hora : 12; 
        let minutos = ahora.getMinutes() < 10 ? '0' + ahora.getMinutes() : ahora.getMinutes();
        let fechaGenerada = `${dias[ahora.getDay()]}, ${ahora.getDate()} de ${meses[ahora.getMonth()]} de ${ahora.getFullYear()} - ${hora}:${minutos} ${ampm}`;

        // 5. MOSTRAR DATOS
        document.getElementById('displayMonto').innerText = "S/ " + monto;
        document.getElementById('displayFecha').innerText = fechaGenerada;
        document.getElementById('displayNombre').innerText = nombre;
        document.getElementById('displayNumero').innerText = numeroFinal;
        document.getElementById('displayEntidad').innerText = entidad;
        document.getElementById('numOperacion').innerText = "0" + randomOp; 

        // --- 6. GUARDAR EN HISTORIAL ---
        let movimientos = JSON.parse(localStorage.getItem('bcp_movimientos')) || [];
        let fechaCorta = ahora.getDate() + " " + meses[ahora.getMonth()]; 

        let tituloHistorial = "Pago YAPE de " + ultimosCuatro;

        let nuevoMov = {
            tipo: "yape", 
            letra: "PA", 
            titulo: tituloHistorial,
            fecha: fechaCorta,
            fechaCompleta: fechaGenerada, 
            monto: monto,
            destinoNombre: nombre,
            destinoNumero: celular,
            entidad: entidad, // <--- ESTA ES LA LÍNEA NUEVA
            numOperacion: "0" + randomOp
        };

        if(!sessionStorage.getItem('mov_guardado_yape_' + randomOp)){
            movimientos.unshift(nuevoMov);
            localStorage.setItem('bcp_movimientos', JSON.stringify(movimientos));
            sessionStorage.setItem('mov_guardado_yape_' + randomOp, 'true'); 
        }

        // --- 7. FUNCIONES DE DESCARGAR Y COMPARTIR ---
        function prepararParaFoto(esParaFoto) {
            const botonesSuperior = document.getElementById('divAcciones');
            const btnInferior = document.getElementById('btnOtra');
            const linkInferior = document.getElementById('linkInicio');
            if (esParaFoto) {
                botonesSuperior.style.display = 'none';
                btnInferior.style.display = 'none';
                linkInferior.style.display = 'none';
            } else {
                botonesSuperior.style.display = 'flex';
                btnInferior.style.display = 'block';
                linkInferior.style.display = 'inline';
            }
        }

        function descargarVoucher() {
            prepararParaFoto(true); 
            setTimeout(() => {
                html2canvas(document.getElementById('captureArea'), { backgroundColor: '#002a80', scale: 2 }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `Voucher_${entidad}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    prepararParaFoto(false); 
                });
            }, 150); 
        }

        function compartirVoucher() {
            prepararParaFoto(true);
            setTimeout(() => {
                html2canvas(document.getElementById('captureArea'), { backgroundColor: '#002a80', scale: 2 }).then(canvas => {
                    canvas.toBlob(blob => {
                        const file = new File([blob], `Voucher_${entidad}.png`, { type: 'image/png' });
                        if (navigator.share) {
                            navigator.share({
                                title: `Voucher de ${entidad}`,
                                files: [file]
                            }).then(() => {
                                prepararParaFoto(false);
                            }).catch(err => {
                                console.log('Error al compartir:', err);
                                prepararParaFoto(false);
                            });
                        } else {
                            alert('Tu navegador no soporta la función de compartir directo.');
                            prepararParaFoto(false);
                        }
                    });
                });
            }, 150);
        }
    </script>
<script src="zoom.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('Error SW', err));
            });
        }
    </script>
</body>
</html>
