<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mi Cuenta - Banca Móvil</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
        <link rel="stylesheet" href="css/cuentas.css">

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#002A8D">
    <link rel="apple-touch-icon" href="img/app-icon.png">
</head>
<body>

    <div class="mobile-wrapper">
        
        <header class="blue-header">
            <button class="back-btn" onclick="window.location.href='inicio.html'">
                <svg viewBox="0 0 24 24"><path d="M20 12H4M10 6l-6 6 6 6"/></svg>
            </button>
            <div class="header-title">Mi cuenta</div>
        </header>

        <main class="scroll-content">
            
            <div class="account-details-container">
                <div class="acc-row">
                    <span class="acc-title">CUENTAS DE AHORRO</span>
                    <img src="img/lapiz-cop.svg" alt="Editar" class="icon-orange-small">
                </div>
                <div class="acc-row" style="margin-bottom: 8px;">
                    <span class="acc-number">570-98341256-0-18</span>
                </div>
                <div class="acc-row">
                    <span class="acc-cci">CCI: 002-570-98341256018-14</span>
                    <img src="img/compartir-cop.svg" alt="Compartir" class="icon-orange-small">
                </div>
            </div>

            <div class="balance-section">
                <div class="bal-label">Disponible</div>
                <div class="bal-amount-container">
                    <span class="bal-currency">S/</span>
                    <span class="bal-amount" id="accountBalanceDisplay">0.00</span>
                </div>
            </div>

            <div class="actions-grid">
                <a href="trans.html" class="action-item">
                    <div class="action-circle white-icon">
                        <img src="img/arrows.svg" alt="Transferir">
                    </div>
                    <span class="action-text">Transferir<br>dinero</span>
                </a>

                <a href="servicio.html" class="action-item">
                    <div class="action-circle white-icon">
                        <img src="img/aqua.webp" alt="Pagar">
                    </div>
                    <span class="action-text">Pagar<br>servicios</span>
                </a>

                <div class="action-item">
                    <div class="action-circle full-img">
                        <img src="img/cerdo-icon.jpg" alt="Wardaditos">
                    </div>
                    <span class="action-text">Ahorra con<br>Wardaditos</span>
                </div>

                <div class="action-item">
                    <div class="action-circle">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="5" cy="12" r="2.5" fill="white"/>
                            <circle cx="12" cy="12" r="2.5" fill="white"/>
                            <circle cx="19" cy="12" r="2.5" fill="white"/>
                        </svg>
                    </div>
                    <span class="action-text">Más</span>
                </div>
            </div>

            <div class="banner-container">
                <img src="img/banner.jpg" alt="Monitorea tus finanzas" class="banner-img">
            </div>

            <div class="movs-container">
                <div class="movs-header">
                    <h3 class="movs-title">Movimientos</h3>
                    <img src="img/searchmovs.svg" alt="Buscar" class="search-icon">
                </div>
                
                <div class="movs-list" id="movsList">
                    </div>
            </div>

        </main>

        <footer class="bottom-menu">
            <a href="inicio.html" class="menu-item active" id="btn-inicio">
                <img src="img/inicio-flash.svg" alt="Inicio" class="icon">
                <span class="text">Inicio</span>
            </a>
            <div class="menu-item" id="btn-operaciones">
                <img src="img/operaciones-flash.svg" alt="Operaciones" class="icon">
                <span class="text">Operaciones</span>
            </div>
            <div class="menu-item">
                <img src="img/descubre-flash.svg" alt="Descubre" class="icon">
                <span class="text">Descubre</span>
            </div>
            <a href="opciones.html" class="menu-item">
                <img src="img/configuracion-flash.svg" alt="Configuración" class="icon">
                <span class="text">Configuración</span>
            </a>
        </footer>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // --- 1. CARGAR SALDO ---
            const savedBalance = localStorage.getItem("userBalance");
            const balanceDisplay = document.getElementById("accountBalanceDisplay");
            
            if (savedBalance) {
                balanceDisplay.innerText = parseFloat(savedBalance).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            } else {
                balanceDisplay.innerText = "1,200.00";
            }

            // --- 2. CARGAR Y AGRUPAR MOVIMIENTOS ---
            const movs = JSON.parse(localStorage.getItem('bcp_movimientos')) || [];
            const movsList = document.getElementById('movsList');

            if (movs.length > 0) {
                const meses = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
                const mesActual = meses[new Date().getMonth()];

                const grupos = {};
                const ordenGrupos = []; // Para mantener el orden cronológico

                // Usamos el index para poder saber a qué ID ir en el voucher
                movs.forEach((mov, index) => {
                    mov.originalIndex = index; // Guardamos su posición real

                    // Extraer el mes de "28 febrero"
                    const partesFecha = mov.fecha.split(" ");
                    let mesMov = partesFecha.length > 1 ? partesFecha[1].toLowerCase() : "";

                    // Darle formato visual a la fecha para que el mes sea Mayúscula (Ej: 28 Febrero)
                    let fechaVisual = mov.fecha;
                    if (partesFecha.length === 2) {
                        fechaVisual = partesFecha[0] + " " + partesFecha[1].charAt(0).toUpperCase() + partesFecha[1].slice(1);
                    }

                    // Determinar el título del grupo ("Este mes" o el nombre del mes)
                    let nombreGrupo = "";
                    if (mesMov === mesActual) {
                        nombreGrupo = "Este mes";
                    } else {
                        nombreGrupo = mesMov.charAt(0).toUpperCase() + mesMov.slice(1);
                    }

                    // Agrupar
                    if (!grupos[nombreGrupo]) {
                        grupos[nombreGrupo] = [];
                        ordenGrupos.push(nombreGrupo);
                    }
                    
                    // Modificamos el objeto para agregarle la fecha con mayúscula
                    mov.fechaVisual = fechaVisual;
                    grupos[nombreGrupo].push(mov);
                });

                // Pintar los grupos en el HTML
                let htmlFinal = "";
                ordenGrupos.forEach(grupo => {
                    htmlFinal += `<div class="month-group-header">${grupo}</div>`;
                    
                    grupos[grupo].forEach(mov => {
                        // Formatear el monto con comas y asegurar los decimales
                        let montoF = parseFloat(mov.monto).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                        
                        // AQUÍ ESTÁ EL CAMBIO: Se agrega el onclick y el cursor pointer
                        htmlFinal += `
                            <div class="mov-item" onclick="window.location.href='voucher.html?id=${mov.originalIndex}'" style="cursor: pointer;">
                                <div class="mov-icon">${mov.letra}</div>
                                <div class="mov-details">
                                    <div class="mov-title">${mov.titulo}</div>
                                    <div class="mov-date">${mov.fechaVisual}</div>
                                </div>
                                <div class="mov-right">
                                    <span class="mov-amount">-S/ ${montoF}</span>
                                    <span class="mov-arrow">›</span>
                                </div>
                            </div>
                        `;
                    });
                });

                movsList.innerHTML = htmlFinal;
            }
        });
    </script>
<script src="zoom.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('Error SW', err));
            });
        }
    </script>
</body>
</html>
