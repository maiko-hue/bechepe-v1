<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pagar Servicios - BCP</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
        <link rel="stylesheet" href="css/servicio.css">

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#002A8D">
    <link rel="apple-touch-icon" href="img/app-icon.png">
</head>
<body>

    <!-- Pantalla de carga blanca oculta -->
    <div id="white-loader-screen">
        <div class="loader-container">
            <div class="spinner-ring"></div>
            <img src="img/cargaicono.svg" alt="Cargando" class="loader-icon">
        </div>
    </div>

    <!-- FONDO Y CABECERA -->
    <div class="blue-bg-curve"></div>
    
    <header class="header">
        <!-- Volver atrás -->
        <button class="icon-btn" onclick="window.history.back()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        
        <!-- Logo Central -->
        <img src="img/secondlogo.png" alt="Logo" class="logo-center">
        
        <!-- Ir al Inicio -->
        <button class="icon-btn" onclick="window.location.href='inicio.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </button>
    </header>

    <main class="main-card">
        
        <!-- PANTALLA 1: Búsqueda -->
        <div id="screen-1">
            <h1 class="card-title">Pagar Servicios</h1>
            <p class="card-subtitle">Busca la empresa o servicio a pagar</p>

            <div class="form-group">
                <span class="input-label">BUSCAR EMPRESA</span>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="searchInput" class="custom-input" placeholder="Ej: Luz del Sur, Sedapal..." autocomplete="off">
                </div>
            </div>

            <button class="btn-save" onclick="mostrarPantalla2()">SIGUIENTE</button>
        </div>

        <!-- PANTALLA 2: Detalles del servicio (Oculto al inicio) -->
        <div id="screen-2" style="display: none;">
            
            <div class="company-info">
                <div class="avatar-circle" id="companyAvatar">P</div>
                <div class="company-name" id="companyNameDisplay">PagoEfectivo</div>
                <div class="company-type">Empresa de Servicios</div>
            </div>

            <div class="form-group">
                <span class="input-label">TIPO DE SERVICIO</span>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6"></line>
                        <line x1="8" y1="12" x2="21" y2="12"></line>
                        <line x1="8" y1="18" x2="21" y2="18"></line>
                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                        <line x1="3" y1="18" x2="3.01" y2="18"></line>
                    </svg>
                    <input type="text" id="serviceInput" class="custom-input" placeholder="Ingresar descripción" autocomplete="off">
                </div>
            </div>

            <div class="form-group">
                <span class="input-label">NÚMERO DE SUMINISTRO / PAGO</span>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <input type="text" id="numberInput" class="custom-input" placeholder="Ej: 1234567" autocomplete="off">
                </div>
            </div>

            <button class="btn-save" onclick="irAConfirmacion()">SIGUIENTE</button>
        </div>

    </main>

    <script>
        let selectedCompanyName = "PagoEfectivo"; 

        function mostrarPantalla2() {
            const nombreInput = document.getElementById('searchInput').value.trim();
            if (nombreInput !== "") {
                selectedCompanyName = nombreInput;
                document.getElementById('companyNameDisplay').innerText = selectedCompanyName;
                document.getElementById('companyAvatar').innerText = selectedCompanyName.charAt(0);
            }
            
            // Ocultar pantalla 1, mostrar pantalla 2
            document.getElementById('screen-1').style.display = 'none';
            document.getElementById('screen-2').style.display = 'block';
        }

        function irAConfirmacion() {
            // 1. Capturamos AMBOS datos
            const serviceValue = document.getElementById('serviceInput').value;
            const numberValue = document.getElementById('numberInput').value; 

            // 2. Guardamos en localStorage
            localStorage.setItem('v_empresa_nombre', selectedCompanyName);
            localStorage.setItem('v_servicio_input', serviceValue); 
            localStorage.setItem('v_numero_input', numberValue);  

            // 3. Animación de carga blanca
            document.getElementById('white-loader-screen').style.display = 'flex';
            setTimeout(function() {
                window.location.href = 'comfir_serv.html';
            }, 3000);
        }
    </script>
<script src="zoom.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('Error SW', err));
            });
        }
    </script>
</body>
</html>
