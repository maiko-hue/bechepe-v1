<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escanear QR</title>
    <link rel="icon" href="img/favicon.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

        <link rel="stylesheet" href="css/escanear.css">

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#002A8D">
    <link rel="apple-touch-icon" href="img/app-icon.png">
</head>
<body>

    <video id="camera-stream" autoplay playsinline muted></video>

    <div class="ui-layer">
        
        <div class="header">
            <div class="header-title">Escanear código QR</div>
            <a href="inicio.html" class="close-btn"><i class="fa-solid fa-xmark"></i></a>
        </div>

        <div class="scan-area">
            <div class="scan-frame"></div>
            
            <div class="flashlight-container" id="btnFlash">
                <div class="flash-icon"><i class="fa-solid fa-power-off"></i></div>
                <div class="flash-text">Encender la linterna</div>
            </div>
        </div>

        <div class="footer">
            <button class="gallery-btn" onclick="document.getElementById('fileInput').click()">Buscar QR en mis fotos</button>
        </div>

    </div>

    <input type="file" id="fileInput" accept="image/*">
    <div class="loader-overlay" id="mainLoader">
        <div class="loader-card">
            <div class="custom-spinner"></div>
            <div class="loader-msg" id="loaderText">Procesando...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Conexión a tu Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDHDXn-R6jgd4fBkgW4KzFp6p6Ym_yqQoI",
            authDomain: "yapedata.firebaseapp.com",
            projectId: "yapedata",
            storageBucket: "yapedata.firebasestorage.app",
            messagingSenderId: "228862586517",
            appId: "1:228862586517:web:4e2b2578fe0f826e32b59c"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Variables de UI
        const fileInput = document.getElementById('fileInput');
        const loader = document.getElementById('mainLoader');
        const loaderText = document.getElementById('loaderText');
        const video = document.getElementById('camera-stream');

        const canvasElement = document.createElement('canvas');
        const canvas = canvasElement.getContext('2d');
        let escaneando = true;
        let streamTrack = null;

        // INICIAR CÁMARA
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { 
                streamTrack = stream.getVideoTracks()[0];
                video.srcObject = stream;
                video.setAttribute("playsinline", true); 
                video.play();
                requestAnimationFrame(escanearVideo); 
            })
            .catch(err => {
                alert("No se pudo acceder a la cámara. Revisa los permisos.");
            });
        }

        // BUCLE DE ESCANEO
        function escanearVideo() {
            if (!escaneando) return;

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvasElement.height = video.videoHeight;
                canvasElement.width = video.videoWidth;
                
                canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
                const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                
                const code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "dontInvert",
                });

                if (code) {
                    escaneando = false; 
                    video.pause(); 
                    buscarEnFirebase(code.data);
                }
            }
            if (escaneando) {
                requestAnimationFrame(escanearVideo);
            }
        }

        // LÓGICA DE SUBIR IMAGEN DESDE GALERÍA
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            escaneando = false; 
            loaderText.textContent = "Analizando imagen...";
            loader.classList.add('show');

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvasGaleria = document.createElement('canvas');
                    const contextGaleria = canvasGaleria.getContext('2d');
                    canvasGaleria.width = img.width;
                    canvasGaleria.height = img.height;
                    contextGaleria.drawImage(img, 0, 0, img.width, img.height);
                    
                    const imageData = contextGaleria.getImageData(0, 0, canvasGaleria.width, canvasGaleria.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);

                    if (code) {
                        buscarEnFirebase(code.data);
                    } else {
                        alert("No se encontró ningún QR válido en la imagen.");
                        loader.classList.remove('show');
                        escaneando = true;
                        requestAnimationFrame(escanearVideo);
                    }
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // CONEXIÓN A FIREBASE PARA BUSCAR EL QR
        async function buscarEnFirebase(qrCodeData) {
            loaderText.textContent = "Verificando QR...";
            loader.classList.add('show');
            
            try {
                // Limpiamos espacios o saltos de línea extraños del QR
                const qrIdLimpio = qrCodeData.trim(); 
                
                const docRef = doc(db, "codigos_qr", qrIdLimpio);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    // EL QR ESTÁ EN LA BASE DE DATOS
                    const data = docSnap.data();
                    
                    localStorage.setItem('v_cuenta', qrIdLimpio);
                    localStorage.setItem('es_qr', 'true');
                    if (data.nombre) {
                        localStorage.setItem('v_nombre_destino', data.nombre);
                    }
                    
                    window.location.href = 'montobcp.html';
                } else {
                    // --- NUEVA LÓGICA PERMISIVA (MODIFICADO) ---
                    // EL QR NO ESTÁ EN LA BASE, PERO LO DEJAMOS PASAR IGUAL
                    
                    // Guardamos el código escaneado de todas formas
                    localStorage.setItem('v_cuenta', qrIdLimpio);
                    localStorage.setItem('es_qr', 'true');
                    
                    // Limpiamos nombre y destino para que la pantalla de monto no muestre basura
                    localStorage.setItem('v_nombre_destino', "");
                    localStorage.removeItem('v_destino_qr'); 
                    
                    // Redirigimos silenciosamente
                    window.location.href = 'montobcp.html';
                }

            } catch (error) {
                console.error("Error Firebase:", error);
                
                // En caso de que falle el internet, también lo dejamos pasar como medida de seguridad UX
                const qrIdLimpio = qrCodeData.trim();
                localStorage.setItem('v_cuenta', qrIdLimpio);
                    localStorage.setItem('es_qr', 'true');
                localStorage.setItem('v_nombre_destino', "");
                localStorage.removeItem('v_destino_qr');
                window.location.href = 'montobcp.html';
            }
        }

        // LINTERNA (Solo funciona en algunos navegadores/dispositivos modernos)
        const btnFlash = document.getElementById('btnFlash');
        let flashActivo = false;
        btnFlash.addEventListener('click', async () => {
            if (streamTrack && typeof streamTrack.getCapabilities === 'function') {
                const capabilities = streamTrack.getCapabilities();
                if (capabilities.torch) {
                    flashActivo = !flashActivo;
                    try {
                        await streamTrack.applyConstraints({
                            advanced: [{ torch: flashActivo }]
                        });
                    } catch (e) {
                        console.log("Linterna no soportada", e);
                    }
                } else {
                    alert("Tu dispositivo no soporta encender la linterna desde el navegador.");
                }
            }
        });
    </script>
<script src="zoom.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('Error SW', err));
            });
        }
    </script>
</body>
</html>
