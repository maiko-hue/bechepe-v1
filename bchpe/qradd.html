<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agregar QR - BCP</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Librería para leer QR (INTACTA) -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <style>
        * {
            /* Elimina el recuadro azul al hacer clic en celulares */
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
            
            /* Bloquea la selección de texto en toda la app */
            -webkit-user-select: none !important; 
            -moz-user-select: none !important; 
            -ms-user-select: none !important; 
            user-select: none !important; 
            box-sizing: border-box;
        }

        /* Excepción para que sí se pueda seleccionar/escribir en los inputs */
        input, textarea, select {
            -webkit-user-select: auto !important;
            -moz-user-select: auto !important;
            -ms-user-select: auto !important;
            user-select: auto !important;
        }

        /* Bloquea el menú de descarga al mantener presionadas las imágenes */
        img {
            -webkit-touch-callout: none !important;
            -webkit-user-drag: none !important;
        }

        body {
            background-color: #f2f4f7;
            margin: 0;
            font-family: 'Roboto', sans-serif;
            /* Evita que la página se recargue al deslizar hacia abajo (Pull-to-refresh) */
            overscroll-behavior-y: none;
            overflow-x: hidden;
            height: 100vh;
        }

        /* --- FONDO SUPERIOR AZUL BCP --- */
        .blue-bg-curve {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 250px;
            background-color: #002A8D;
            border-bottom-left-radius: 35px;
            border-bottom-right-radius: 35px;
            z-index: 1;
        }

        /* --- CABECERA --- */
        .header {
            display: flex;
            align-items: center;
            padding: 20px;
            position: relative;
            z-index: 2;
            height: 120px;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            cursor: pointer;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            position: absolute;
            left: 20px;
            top: 30px;
        }
        .logo-center {
            height: 100px;
            object-fit: contain;
            position: absolute;
            left: 50%;
            top: 15px;
            transform: translateX(-50%);
        }

        /* --- TARJETA BLANCA PRINCIPAL --- */
        .main-card {
            position: relative;
            z-index: 3;
            background: white;
            margin: 10px 20px 40px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 30px 20px;
        }
        
        .card-title {
            font-size: 22px;
            font-weight: 700;
            color: #002A8D;
            text-align: center;
            margin: 0 0 5px 0;
        }
        .card-subtitle {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin: 0 0 30px 0;
        }

        /* --- ZONA DE SUBIDA DE IMAGEN --- */
        .upload-area {
            background-color: #f9f9fb;
            border: 2px dashed #ccc;
            border-radius: 16px;
            height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .upload-area:hover {
            border-color: #002A8D;
            background-color: #e6f0ff;
        }
        .upload-icon {
            width: 45px;
            height: 45px;
            color: #002A8D;
            margin-bottom: 10px;
            opacity: 0.8;
        }
        .upload-text {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }
        #previewImg {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
            background: white;
            z-index: 5;
        }

        /* --- FORMULARIO Y ESTILOS DE CASILLAS --- */
        .form-group {
            margin-bottom: 25px;
        }
        .input-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #888;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .input-wrapper {
            display: flex;
            align-items: center;
            background-color: #f9f9fb;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            padding: 14px 15px;
            transition: border-color 0.3s;
        }
        .input-wrapper:focus-within {
            border-color: #FF7800; /* Naranja BCP en el focus */
            background-color: #ffffff;
        }
        .input-icon {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            flex-shrink: 0;
            color: #002A8D;
        }
        .custom-input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            outline: none;
            font-family: 'Roboto', sans-serif;
        }
        .custom-input::placeholder {
            color: #aaa;
            font-weight: 400;
        }
        
        /* Estilos específicos para el Select */
        select.custom-input {
            -webkit-appearance: none; 
            appearance: none; 
            cursor: pointer;
        }
        select.custom-input option {
            background-color: white; 
            color: #333;
        }

        /* --- BOTÓN GUARDAR --- */
        .btn-save {
            width: 100%;
            background-color: #002A8D;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 16px;
            font-size: 15px;
            font-weight: 600;
            margin-top: 5px;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: transform 0.1s, background-color 0.3s;
        }
        .btn-save:active {
            transform: scale(0.97);
        }

        /* --- ESTILOS DE LA ANIMACIÓN (PACMAN) --- */
        .custom-loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 9999;
            display: none; justify-content: center; align-items: center;
            flex-direction: column; backdrop-filter: blur(4px);
        }
        .loader { width: 8em; height: 8em; }
        .loader__eye1, .loader__eye2, .loader__mouth1, .loader__mouth2 { animation: eye1 3s ease-in-out infinite; }
        .loader__eye1, .loader__eye2 { transform-origin: 64px 64px; }
        .loader__eye2 { animation-name: eye2; }
        .loader__mouth1 { animation-name: mouth1; }
        .loader__mouth2 { animation-name: mouth2; visibility: hidden; }
        @keyframes eye1 {
            from { transform: rotate(-260deg) translate(0, -56px); }
            50%, 60% { animation-timing-function: cubic-bezier(0.17, 0, 0.58, 1); transform: rotate(-40deg) translate(0, -56px) scale(1); }
            to { transform: rotate(225deg) translate(0, -56px) scale(0.35); }
        }
        @keyframes eye2 {
            from { transform: rotate(-260deg) translate(0, -56px); }
            50% { transform: rotate(40deg) translate(0, -56px) rotate(-40deg) scale(1); }
            52.5% { transform: rotate(40deg) translate(0, -56px) rotate(-40deg) scale(1, 0); }
            55%, 70% { animation-timing-function: cubic-bezier(0, 0, 0.28, 1); transform: rotate(40deg) translate(0, -56px) rotate(-40deg) scale(1); }
            to { transform: rotate(150deg) translate(0, -56px) scale(0.4); }
        }
        @keyframes mouth1 {
            from { animation-timing-function: ease-in; stroke-dasharray: 0 351.86; stroke-dashoffset: 0; }
            25% { animation-timing-function: ease-out; stroke-dasharray: 175.93 351.86; stroke-dashoffset: 0; }
            50% { animation-timing-function: steps(1, start); stroke-dasharray: 175.93 351.86; stroke-dashoffset: -175.93; visibility: visible; }
            75%, to { visibility: hidden; }
        }
        @keyframes mouth2 {
            from { animation-timing-function: steps(1, end); visibility: hidden; }
            50% { animation-timing-function: ease-in-out; visibility: visible; stroke-dashoffset: 0; }
            to { stroke-dashoffset: -351.86; }
        }

        /* --- NOTIFICACIÓN PERSONALIZADA (TOAST) --- */
        .toast {
            visibility: hidden; min-width: 250px; margin-left: -125px;
            background-color: #333; color: #fff; text-align: center;
            border-radius: 50px; padding: 16px; position: fixed;
            z-index: 10000; left: 50%; bottom: 30px; font-size: 14px; font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }
        .toast.show { visibility: visible; opacity: 1; bottom: 50px; }
        .toast.success { background-color: #2BD071; color: white; }
        .toast.error { background-color: #d32f2f; color: white; }
    </style>
</head>
<body>

    <!-- Animación Pacman de Carga -->
    <div class="custom-loader-overlay" id="pacmanLoader">
        <svg height="108px" width="108px" viewBox="0 0 128 128" class="loader">
            <defs>
              <clipPath id="loader-eyes">
                <circle transform="rotate(-40,64,64) translate(0,-56)" r="8" cy="64" cx="64" class="loader__eye1"></circle>
                <circle transform="rotate(40,64,64) translate(0,-56)" r="8" cy="64" cx="64" class="loader__eye2"></circle>
              </clipPath>
              <linearGradient y2="1" x2="0" y1="0" x1="0" id="loader-grad">
                <stop stop-color="#000" offset="0%"></stop>
                <stop stop-color="#fff" offset="100%"></stop>
              </linearGradient>
              <mask id="loader-mask">
                <rect fill="url(#loader-grad)" height="128" width="128" y="0" x="0"></rect>
              </mask>
            </defs>
            <g stroke-dasharray="175.93 351.86" stroke-width="12" stroke-linecap="round">
              <g>
                <rect clip-path="url(#loader-eyes)" height="64" width="128" fill="hsl(193,90%,50%)"></rect>
                <g stroke="hsl(193,90%,50%)" fill="none">
                  <circle transform="rotate(180,64,64)" r="56" cy="64" cx="64" class="loader__mouth1"></circle>
                  <circle transform="rotate(0,64,64)" r="56" cy="64" cx="64" class="loader__mouth2"></circle>
                </g>
              </g>
              <g mask="url(#loader-mask)">
                <rect clip-path="url(#loader-eyes)" height="64" width="128" fill="hsl(223,90%,50%)"></rect>
                <g stroke="hsl(223,90%,50%)" fill="none">
                  <circle transform="rotate(180,64,64)" r="56" cy="64" cx="64" class="loader__mouth1"></circle>
                  <circle transform="rotate(0,64,64)" r="56" cy="64" cx="64" class="loader__mouth2"></circle>
                </g>
              </g>
            </g>
        </svg>
        <p style="margin-top:20px; font-weight:600; color:white;">Guardando QR en la Nube...</p>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">Mensaje aquí</div>

    <!-- FONDO Y CABECERA -->
    <div class="blue-bg-curve"></div>
    
    <header class="header">
        <a href="opciones.html" class="back-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <img src="img/secondlogo.png" alt="Logo" class="logo-center">
    </header>

    <main class="main-card">
        <h1 class="card-title">Nuevo QR</h1>
        <p class="card-subtitle">Sube el código y regístralo</p>

        <!-- Zona de subida de imagen -->
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <div class="upload-text">Toca para subir imagen</div>
            <img id="previewImg" src="" alt="QR Preview">
            <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="previewFile()">
        </div>

        <!-- Formulario -->
        <div class="form-group">
            <span class="input-label">NOMBRE DEL TITULAR / NEGOCIO</span>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <input type="text" id="qrName" class="custom-input" placeholder="Ej: Juan Perez" autocomplete="off">
            </div>
        </div>

        <div class="form-group">
            <span class="input-label">DESTINO</span>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="10" rx="2" ry="2"></rect>
                    <circle cx="12" cy="5" r="2"></circle>
                    <path d="M12 7v4"></path>
                    <line x1="8" y1="16" x2="8.01" y2="16"></line>
                    <line x1="16" y1="16" x2="16.01" y2="16"></line>
                </svg>
                <select id="qrDestino" class="custom-input">
                    <option value="Yape">Yape</option>
                    <option value="Plin">Plin</option>
                    <option value="Bim">Bim</option>
                    <option value="Tunki">Tunki</option>
                    <option value="Agora / Oh!">Agora / Oh!</option>
                    <option value="BCP">BCP</option>
                    <option value="BBVA">BBVA</option>
                    <option value="Interbank">Interbank</option>
                    <option value="Financiera Efectiva">Financiera Efectiva</option>
                    <option value="Dale">Dale</option>
                    <option value="IziPay">IziPay</option>
                </select>
            </div>
        </div>

        <button class="btn-save" id="btnGuardarQR">GUARDAR QR</button>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Credenciales de la app BCP (yapedata)
        const firebaseConfig = {
            apiKey: "AIzaSyDHDXn-R6jgd4fBkgW4KzFp6p6Ym_yqQoI",
            authDomain: "yapedata.firebaseapp.com",
            projectId: "yapedata",
            storageBucket: "yapedata.firebasestorage.app",
            messagingSenderId: "228862586517",
            appId: "1:228862586517:web:4e2b2578fe0f826e32b59c"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Variable global para guardar el código leído
        let scannedQrCode = null;

        window.showToast = function(message, type) {
            var x = document.getElementById("toast");
            x.textContent = message;
            x.className = "toast show " + type;
            setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
        }

        // --- FUNCIÓN PARA PREVISUALIZAR Y LEER EL QR ---
        window.previewFile = function() {
            const preview = document.getElementById('previewImg');
            const file = document.querySelector('input[type=file]').files[0];
            const reader = new FileReader();

            reader.addEventListener("load", function () {
                // 1. Mostrar imagen
                preview.src = reader.result;
                preview.style.display = 'block';

                // 2. Intentar leer el QR invisiblemente
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    context.drawImage(img, 0, 0, img.width, img.height);
                    const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                    
                    // Usar librería jsQR
                    const code = jsQR(imageData.data, imageData.width, imageData.height);

                    if (code) {
                        scannedQrCode = code.data;
                        console.log("QR Leído:", scannedQrCode);
                        showToast("Código QR detectado correctamente", "success");
                    } else {
                        scannedQrCode = null;
                        showToast("No se detectó ningún QR en la imagen", "error");
                    }
                };
                img.src = reader.result;

            }, false);

            if (file) {
                reader.readAsDataURL(file);
            }
        }

        document.getElementById('btnGuardarQR').addEventListener('click', async () => {
            const name = document.getElementById('qrName').value;
            const destino = document.getElementById('qrDestino').value;
            const imgCheck = document.getElementById('previewImg').src;
            const loader = document.getElementById('pacmanLoader');

            // VALIDACIÓN
            if(!imgCheck || imgCheck === "" || document.getElementById('fileInput').files.length === 0) {
                showToast("Falta subir la imagen", "error");
                return;
            }
            if(name.trim() === "") {
                showToast("Falta el nombre", "error");
                return;
            }
            if(!scannedQrCode) {
                showToast("La imagen no contiene un QR válido", "error");
                return;
            }

            // SI TODO ESTÁ BIEN:
            loader.style.display = 'flex';

            try {
                // Limpiamos los espacios en blanco del ID
                const safeId = scannedQrCode.trim();

                // GUARDAR EN FIREBASE (Colección 'codigos_qr')
                await setDoc(doc(db, "codigos_qr", safeId), {
                    nombre: name,
                    destino: destino,
                    codigo_original: scannedQrCode,
                    fecha: new Date().toISOString()
                });
                
                // ÉXITO
                loader.style.display = 'none';
                showToast("¡QR Guardado en la Nube!", "success");

                setTimeout(() => {
                    window.location.href = 'opciones.html';
                }, 1500);

            } catch (e) {
                console.error(e);
                loader.style.display = 'none';
                showToast("Error al guardar en la nube", "error");
            }
        });
    </script>
</body>
</html>
