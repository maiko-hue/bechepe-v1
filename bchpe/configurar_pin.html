<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Configurar PIN</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background: #ffffff; overflow-x: hidden; }
        .header { background: transparent !important; box-shadow: none !important; position: absolute; top: 0; left: 0; width: 100%; z-index: 10; }
        .pin-hero { height: 50vh; width: 100%; background: url('img/pin.jpg') center/cover no-repeat; position: relative; }
        .pin-content { background: #ffffff; min-height: 55vh; margin-top: -5px; position: relative; z-index: 5; padding: 30px 20px; text-align: center; }
        
        .btn-pin { background: #002A8D; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: 600; width: 100%; margin-bottom: 15px; cursor: pointer; }
        .btn-del { background: transparent; color: #d32f2f; border: 1px solid #d32f2f; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: 600; width: 100%; cursor: pointer; display: none; }
        
        .cuy-container { position: absolute; bottom: 20px; left: 20px; display: flex; flex-direction: column; align-items: flex-start; z-index: 10; }
        .cuy-bubble { background: white; border-radius: 15px; padding: 12px 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); max-width: 200px; margin-bottom: 10px; position: relative; border-bottom-left-radius: 0; font-size: 13px; color: #333; line-height: 1.4; font-weight: 500; text-align: left; }
        .cuy-bubble::after { content: ''; position: absolute; bottom: -8px; left: 0; width: 0; height: 0; border-top: 10px solid white; border-right: 10px solid transparent; }
        
        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal-card { background: white; width: 85%; border-radius: 8px; padding: 25px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); text-align: left; }
        .modal-card h3 { color: #333; margin: 0 0 15px 0; font-size: 18px; font-weight: 600; }
        .modal-card input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 18px; letter-spacing: 5px; text-align: center; margin-bottom: 20px; box-sizing: border-box; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 15px; }
        .modal-buttons span { font-weight: 600; font-size: 15px; cursor: pointer; text-transform: uppercase; }
    </style>

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#002A8D">
    <link rel="apple-touch-icon" href="img/app-icon.png">
</head>
<body>
    <header class="header">
        <a href="opciones.html" class="back-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
    </header>

    <div class="pin-hero"></div>
    
    <div class="pin-content">
        <h2 style="color: #002A8D; margin-bottom: 25px; font-size: 22px;">Seguridad de Acceso</h2>
        <button id="btn-definir" class="btn-pin" onclick="abrirDefinir()">Definir PIN</button>
        <button id="btn-borrar" class="btn-del" onclick="abrirBorrar()">Borrar PIN</button>
        <button id="btn-probar" class="btn-del" style="color: #002A8D; border-color: #002A8D; margin-top: 15px; display: none;" onclick="window.location.href='login_pin.html'">Probar PIN</button>

        <!-- Cuy -->
        <div class="cuy-container">
            <div class="cuy-bubble" id="cuyText">Cargando...</div>
            <img src="img/cuy.png" alt="Cuy" style="width: 60px; height: 60px; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));">
        </div>
    </div>

    <!-- Modal Definir -->
    <div class="modal-overlay" id="modalDefinir">
        <div class="modal-card">
            <h3>Ingresa tu nuevo PIN</h3>
            <input type="password" id="inputNewPin" inputmode="numeric" maxlength="6" placeholder="******">
            <div class="modal-buttons">
                <span style="color: #666;" onclick="cerrarDefinir()">Cancelar</span>
                <span style="color: #002A8D;" onclick="siguientePin()">Siguiente</span>
            </div>
        </div>
    </div>

    <!-- Modal Confirmar -->
    <div class="modal-overlay" id="modalConfirmar">
        <div class="modal-card">
            <h3>Confirma tu nuevo PIN</h3>
            <input type="password" id="inputConfirmPin" inputmode="numeric" maxlength="6" placeholder="******">
            <div class="modal-buttons">
                <span style="color: #666;" onclick="cerrarConfirmar()">Cancelar</span>
                <span style="color: #002A8D;" onclick="guardarPin()">Guardar</span>
            </div>
        </div>
    </div>

    <!-- Modal Borrar -->
    <div class="modal-overlay" id="modalBorrar">
        <div class="modal-card">
            <h3 style="margin-bottom: 10px;">Borrar PIN</h3>
            <p style="color: #666; font-size: 14px; margin: 0 0 25px 0; line-height: 1.5;">&iquest;Est&aacute; usted seguro que quiere borrar el pin que defini&oacute;?</p>
            <div class="modal-buttons">
                <span style="color: #666;" onclick="cerrarBorrar()">No</span>
                <span style="color: #d32f2f;" onclick="borrarPinDefinitivo()">S&iacute;</span>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalError">
        <div class="modal-card" style="text-align: center;">
            <p style="color: #d32f2f; font-size: 16px; margin: 0 0 20px 0; font-weight: 600;" id="errorText">Los PINs no coinciden</p>
            <span style="color: #002A8D; font-weight: 600; cursor: pointer;" onclick="document.getElementById('modalError').style.display='none'">Aceptar</span>
        </div>
    </div>

    <script>
        let tempPin = '';

        function updateUI() {
            const savedPin = localStorage.getItem('user_pin');
            const cuy = document.getElementById('cuyText');
            const btnBorrar = document.getElementById('btn-borrar');
            const btnDefinir = document.getElementById('btn-definir');
            const btnProbar = document.getElementById('btn-probar');
            
            if (savedPin) {
                cuy.innerText = 'Tu pin definido es ' + savedPin;
                btnBorrar.style.display = 'block';
                btnProbar.style.display = 'block';
                btnDefinir.innerText = 'Cambiar PIN';
            } else {
                cuy.innerText = 'Aún no tienes un PIN definido, define uno y mejora la seguridad de tu APP';
                btnBorrar.style.display = 'none';
                btnProbar.style.display = 'none';
                btnDefinir.innerText = 'Definir PIN';
            }
        }

        function abrirDefinir() {
            document.getElementById('inputNewPin').value = '';
            document.getElementById('modalDefinir').style.display = 'flex';
        }
        function cerrarDefinir() {
            document.getElementById('modalDefinir').style.display = 'none';
        }

        function siguientePin() {
            const val = document.getElementById('inputNewPin').value;
            if(val.length !== 6) {
                showError('El PIN debe tener 6 dígitos');
                return;
            }
            tempPin = val;
            cerrarDefinir();
            document.getElementById('inputConfirmPin').value = '';
            document.getElementById('modalConfirmar').style.display = 'flex';
        }
        function cerrarConfirmar() {
            document.getElementById('modalConfirmar').style.display = 'none';
        }

        function guardarPin() {
            const val = document.getElementById('inputConfirmPin').value;
            if(val !== tempPin) {
                showError('Los PINs ingresados no coinciden. Intenta de nuevo.');
                return;
            }
            localStorage.setItem('user_pin', tempPin);
            cerrarConfirmar();
            updateUI();
        }

        function abrirBorrar() {
            document.getElementById('modalBorrar').style.display = 'flex';
        }
        function cerrarBorrar() {
            document.getElementById('modalBorrar').style.display = 'none';
        }
        function borrarPinDefinitivo() {
            localStorage.removeItem('user_pin');
            cerrarBorrar();
            updateUI();
        }

        function showError(msg) {
            document.getElementById('errorText').innerText = msg;
            document.getElementById('modalError').style.display = 'flex';
        }

        document.addEventListener('DOMContentLoaded', updateUI);

        // Inputs only numbers
        document.getElementById('inputNewPin').addEventListener('input', function() { this.value = this.value.replace(/[^0-9]/g, ''); });
        document.getElementById('inputConfirmPin').addEventListener('input', function() { this.value = this.value.replace(/[^0-9]/g, ''); });
    </script>
    <script src="zoom.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('Error SW', err));
            });
        }
    </script>
</body>
</html>
