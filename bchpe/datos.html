<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Datos de Cuenta - BCP</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/datos.css">

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#002A8D">
    <link rel="apple-touch-icon" href="img/app-icon.png">
</head>
<body>

    <!-- FONDO Y CABECERA -->
    <div class="blue-bg-curve"></div>
    
    <header class="header">
        <a href="opciones.html" class="back-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <img src="img/secondlogo.png" alt="Logo" class="logo-center">
    </header>

    <main class="main-card">
        <h1 class="card-title">Datos de Usuario</h1>
        <p class="card-subtitle">Modifica la información de tu cuenta</p>

        <!-- SKELETON LOADER (Muestra la carga inicial) -->
        <div id="skeleton-container">
            <div class="skeleton-label"></div>
            <div class="skeleton-box"></div>
            
            <div class="skeleton-label"></div>
            <div class="skeleton-box"></div>

            <div class="skeleton-label"></div>
            <div class="skeleton-box"></div>

            <div class="skeleton-box" style="border-radius: 30px; margin-top: 15px; background: #e0e0e0;"></div>
        </div>

        <!-- FORMULARIO REAL (Oculto hasta que acabe el skeleton) -->
        <div id="form-container" style="display: none;">
            
            <div class="form-group">
                <span class="input-label">NOMBRE DE USUARIO</span>
                <div class="input-wrapper">
                    <!-- Ícono de Usuario SVG Nativo -->
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <input type="text" id="editName" class="custom-input" placeholder="Ej: Maikol Esleiter" autocomplete="off">
                </div>
            </div>

            <div class="form-group">
                <span class="input-label">SALDO INICIAL</span>
                <div class="input-wrapper">
                    <!-- Ícono de Dinero SVG Nativo -->
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"></path>
                        <line x1="12" y1="18" x2="12" y2="6"></line>
                    </svg>
                    <span style="color: #666; font-weight: 500; font-size: 16px; margin-right: 5px;">S/</span>
                    <input type="tel" id="editBalance" class="custom-input" inputmode="numeric" placeholder="0.00" autocomplete="off">
                </div>
            </div>

            <div class="form-group">
                <span class="input-label">AUTO COMPLETADO</span>
                <div class="toggle-container" onclick="toggleBot()">
                    <!-- Ícono de Bot SVG Nativo -->
                    <div style="display: flex; align-items: center;">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
                            <rect x="3" y="11" width="18" height="10" rx="2" ry="2"></rect>
                            <circle cx="12" cy="5" r="2"></circle>
                            <path d="M12 7v4"></path>
                            <line x1="8" y1="16" x2="8.01" y2="16"></line>
                            <line x1="16" y1="16" x2="16.01" y2="16"></line>
                        </svg>
                        <span class="toggle-text" id="botStatusText">Desactivado</span>
                    </div>
                    <div class="toggle-switch" id="botToggleBtn">
                        <div class="toggle-knob"></div>
                    </div>
                </div>
            </div>

            <button id="saveBtn" class="btn-save" onclick="saveData()">GUARDAR CAMBIOS</button>

        </div>
    </main>

    <div id="toast-msg"></div>

    <script>
        let isBotActive = false;

        // --- SISTEMA DE TOAST ---
        function mostrarToast(mensaje, color) {
            const toast = document.getElementById('toast-msg');
            toast.innerText = mensaje;
            toast.style.backgroundColor = color || '#333';
            toast.className = "show";
            setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
        }

        // --- INICIALIZACIÓN Y SKELETON ---
        document.addEventListener("DOMContentLoaded", () => {
            // Simulamos un tiempo de carga para el efecto Skeleton (1 segundo)
            setTimeout(() => {
                // Ocultar Skeleton y Mostrar Formulario
                document.getElementById('skeleton-container').style.display = 'none';
                document.getElementById('form-container').style.display = 'block';

                // Cargar datos actuales
                const savedName = localStorage.getItem('userName') || '';
                const savedBalance = localStorage.getItem('userBalance') || '0.00';
                const savedBotStatus = localStorage.getItem("bcp_bot_telegram_activo");

                document.getElementById('editName').value = savedName;
                document.getElementById('editBalance').value = parseFloat(savedBalance).toFixed(2);

                if (savedBotStatus === "true") {
                    isBotActive = true;
                    updateBotUI();
                }
            }, 1000); 
        });

        // --- LÓGICA DE ENTRADA DE SALDO ESTILO CAJERO (ATM) ---
        const balanceInput = document.getElementById('editBalance');
        
        balanceInput.addEventListener('input', function(e) {
            // 1. Extraer solamente los números que digita el usuario
            let rawNumbers = this.value.replace(/\D/g, '');
            
            // 2. Si el usuario borra todo, lo devolvemos a 0.00
            if (rawNumbers === '') {
                this.value = '0.00';
                return;
            }

            // 3. Convertirlo a número entero y dividirlo entre 100 para obtener decimales
            let formattedNumber = (parseInt(rawNumbers, 10) / 100).toFixed(2);
            
            // 4. Mostrar el resultado formateado
            this.value = formattedNumber;
        });

        // --- LÓGICA DEL INTERRUPTOR BOT ---
        function toggleBot() {
            isBotActive = !isBotActive;
            updateBotUI();
        }

        function updateBotUI() {
            const btn = document.getElementById("botToggleBtn");
            const txt = document.getElementById("botStatusText");
            if (isBotActive) {
                btn.classList.add("active");
                txt.textContent = "Activado";
                txt.style.color = "#FF7800"; // Naranja BCP
            } else {
                btn.classList.remove("active");
                txt.textContent = "Desactivado";
                txt.style.color = "#333";
            }
        }

        // --- GUARDAR DATOS ---
        function saveData() {
            const btn = document.getElementById('saveBtn');
            const nameInput = document.getElementById("editName").value.trim();
            const balanceInput = document.getElementById("editBalance").value.trim();

            if (!nameInput) {
                mostrarToast('El nombre no puede estar vacío', '#d32f2f');
                return;
            }

            // Efecto de carga en el botón
            btn.innerText = 'GUARDANDO...';
            btn.disabled = true;

            // Simulamos guardado en base de datos local
            setTimeout(() => {
                localStorage.setItem("userName", nameInput);
                localStorage.setItem("userBalance", balanceInput || "0.00");
                localStorage.setItem("bcp_bot_telegram_activo", isBotActive);

                mostrarToast('Datos actualizados con éxito', '#2BD071'); // Verde
                
                // Redirigimos al home o opciones después del Toast
                setTimeout(() => {
                    window.location.href = "opciones.html";
                }, 800);
            }, 800);
        }
    </script>
    
    <script type="module" src="seguridad.js"></script>
<script src="zoom.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('Error SW', err));
            });
        }
    </script>
</body>
</html>
