<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Operación exitosa</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/exito.css">

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#002A8D">
    <link rel="apple-touch-icon" href="img/app-icon.png">
</head>
<body>

    <div class="mobile-wrapper">
        <div class="container" id="captureArea">
            
            <div class="content-wrapper">
                <div class="check-icon">
                    <svg viewBox="0 0 50 50">
                        <circle class="circle-path" cx="25" cy="25" r="23" stroke="#ff7e00" stroke-width="2" fill="none"/>
                        <path class="check-path" d="M15 25 L22 32 L35 18" stroke="#ff7e00" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>

                <h2>¡Operación exitosa!</h2>
                <div class="monto-grande" id="displayMonto">S/ 0.00</div>
                <div class="fecha-sub" id="displayFecha">--</div>

                <div class="acciones" id="divAcciones">
                    <div class="accion-btn" onclick="descargarVoucher()"><img src="img/descargar-icon.svg" alt="Descargar"> Descargar</div>
                    <div class="accion-btn" onclick="compartirVoucher()"><img src="img/compartir-icon.svg" alt="Compartir"> Compartir</div>
                </div>

                <div class="detalles-lista">
                    <div class="fila">
                        <div class="label">Enviado a</div>
                        <div class="valor">
                            <strong id="displayNombre">Nombre Contacto</strong>
                            <span id="displayNumero" style="letter-spacing: 1px;">*** **4 214</span>
                            <span id="displayEntidad">Yape</span> 
                        </div>
                    </div>
                    
                    <div class="fila">
                        <div class="label">Comisión</div>
                        <div class="valor">
                            <strong>Gratis</strong>
                        </div>
                    </div>

                    <div class="fila">
                        <div class="label">Desde</div>
                        <div class="valor">
                            <strong>Cuenta Digital Soles</strong>
                            <span>**** 7809</span>
                        </div>
                    </div>
                    <div class="fila" style="border-bottom: none;"> 
                        <div class="label">Número de operación</div>
                        <div class="valor">
                            <strong id="numOperacion">0000000</strong>
                        </div>
                    </div>
                </div>

                <div class="separador-banner" id="divSeparador"></div>

                                <div class="banner" id="divBanner" style="padding: 0; background: transparent; height: auto;">
                    <img src="img/exito.jpeg" alt="Promocion" style="width: 100%; height: auto; object-fit: contain; border-radius: 10px;">
                </div>

                <button class="btn-otra" id="btnOtra" onclick="window.location.href='trans.html'">Nueva transferencia</button>
                <a href="inicio.html" class="link-inicio" id="linkInicio">Ir al inicio</a>
            </div>

        </div>
    </div>

    <script>
                        // --- LOGICA EXITO EDITABLE ---
        const nombre = localStorage.getItem('v_nombre') || "Nombre";
        const cuenta = localStorage.getItem('v_cuenta') || "0000";
        let monto = localStorage.getItem('v_monto');
        const fecha = localStorage.getItem('v_fecha') || "Sábado 10 octubre 2026 - 04:51 pm.";

                let montoFormateado = "0.00";
        if(monto) {
            let numLimpio = parseFloat(monto.toString().replace(/,/g, ''));
            if (!isNaN(numLimpio)) {
                montoFormateado = numLimpio.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            }
        }

        // En editable.html el input de cuenta pide solo 4 digitos
        let numeroFinal = "**** " + cuenta;

        const randomOp = Math.floor(10000000 + Math.random() * 90000000);

        document.getElementById('displayMonto').innerText = "S/ " + montoFormateado;
        document.getElementById('displayFecha').innerText = fecha;
        document.getElementById('displayNombre').innerText = nombre;
        document.getElementById('displayNumero').innerText = numeroFinal;
        
        // Editable suele ser solo transferencias normales (o podemos ocultar Entidad si queremos)
        // Por defecto editable es Cuenta Digital Soles -> mostramos oculto o nada la entidad de Yape
        document.getElementById('displayEntidad').style.display = 'none';
        
        document.getElementById('numOperacion').innerText = "0" + randomOp;

        // Limpiar para que no afecte otras operaciones
        // No limpiamos aquí para que el editable pueda hacer refresh y mantener los datos, 
        // o los limpiamos dependiendo de la preferencia. Mejor no limpiar por si acaso refrescan la pgina.

        // --- 7. FUNCIONES DE DESCARGAR Y COMPARTIR ---
        function prepararParaFoto(esParaFoto) {
            const botonesSuperior = document.getElementById('divAcciones');
            const btnInferior = document.getElementById('btnOtra');
            const linkInferior = document.getElementById('linkInicio');
            if (esParaFoto) {
                botonesSuperior.style.display = 'none';
                btnInferior.style.display = 'none';
                linkInferior.style.display = 'none';
            } else {
                botonesSuperior.style.display = 'flex';
                btnInferior.style.display = 'block';
                linkInferior.style.display = 'block';
            }
        }

        function descargarVoucher() {
            prepararParaFoto(true); 
            setTimeout(() => {
                html2canvas(document.getElementById('captureArea'), { backgroundColor: '#002a80', scale: 2 }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `Voucher_${entidad}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    prepararParaFoto(false); 
                });
            }, 150); 
        }

        function compartirVoucher() {
            prepararParaFoto(true);
            setTimeout(() => {
                html2canvas(document.getElementById('captureArea'), { backgroundColor: '#002a80', scale: 2 }).then(canvas => {
                    canvas.toBlob(blob => {
                        const file = new File([blob], `Voucher_${entidad}.png`, { type: 'image/png' });
                        if (navigator.share) {
                            navigator.share({
                                title: `Voucher de ${entidad}`,
                                files: [file]
                            }).then(() => {
                                prepararParaFoto(false);
                            }).catch(err => {
                                console.log('Error al compartir:', err);
                                prepararParaFoto(false);
                            });
                        } else {
                            alert('Tu navegador no soporta la función de compartir directo.');
                            prepararParaFoto(false);
                        }
                    });
                });
            }, 150);
        }
    </script>
<script src="zoom.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('Error SW', err));
            });
        }
    </script>
</body>
</html>
